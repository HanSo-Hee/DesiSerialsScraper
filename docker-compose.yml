version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: serial_bot_db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  bot:
    build: .
    container_name: serial_bot_app
    restart: always
    depends_on:
      - mongodb
    env_file:
      - .env
    volumes:
      - ./downloads:/app/downloads

volumes:
  mongo_data:
